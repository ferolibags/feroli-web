<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedido · FEROLI</title>
<meta property="og:site_name" content="FEROLI">
<meta property="og:title" content="Pedido FEROLI · ORIGEN">
<meta property="og:description" content="Las piezas que elegiste, con sus fotos y el total.">
<meta property="og:image" content="https://feroli-web.vercel.app/img/og/pedido.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="img/brand/favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'Qwenzy';src:url('fonts/qwenzy.woff2') format('woff2');font-display:swap}
:root{--marfil:#F6F1E9;--vino:#3D1012;--tinta:#2A1715;--t60:#6E5E58;--linea:rgba(61,16,18,.16)}
*{box-sizing:border-box}
body{margin:0;background:var(--marfil);color:var(--tinta);font:15px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:40px 20px 64px}
.top{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:20px;border-bottom:1px solid var(--linea)}
.logo{font:400 34px/1 Qwenzy,Georgia,serif;color:var(--vino);text-decoration:none}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;color:var(--t60)}
h1{font:400 clamp(40px,7vw,64px)/1 Qwenzy,Georgia,serif;color:var(--vino);margin:40px 0 8px}
.list{display:grid;gap:0;margin-top:28px}
.item{display:grid;grid-template-columns:120px 1fr auto;gap:20px;align-items:center;padding:18px 0;border-bottom:1px solid var(--linea);animation:rise .7s cubic-bezier(.16,1,.3,1) both}
.item img{width:120px;aspect-ratio:1020/1320;object-fit:contain;background:#fff}
.name{font:400 24px/1.1 Qwenzy,Georgia,serif;color:var(--vino)}
.meta{font-size:13px;color:var(--t60);margin-top:4px}
.sum{font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:26px 0}
.total strong{font:400 40px Qwenzy,Georgia,serif;color:var(--vino)}
.actions{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;min-height:50px;padding:0 26px;border-radius:999px;background:var(--vino);color:var(--marfil);text-decoration:none}
.btn--ghost{background:none;color:var(--vino);border:1px solid var(--vino)}
.empty{padding:40px 0;color:var(--t60)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@media (max-width:520px){.item{grid-template-columns:84px 1fr;} .item img{width:84px} .sum{grid-column:2}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="logo" href="./">FEROLI</a><span class="eyebrow">Pedido · ORIGEN</span></div>
  <h1>Tu selección</h1>
  <p class="eyebrow" id="count"></p>
  <div class="list" id="list"></div>
  <div class="total" id="total"><span class="eyebrow">Total</span><strong></strong></div>
  <div class="actions"><a class="btn" id="wa" target="_blank" rel="noopener">Escribir a FEROLI</a><a class="btn btn--ghost" href="./#coleccion">Ver la colección</a></div>
</div>
<script src="js/productos.js"></script>
<script>
(function(){
  var by={};PRODUCTOS.forEach(function(p){by[p.id]=p;});
  var pr=function(n){return '$'+String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');};
  var items=decodeURIComponent(location.hash.slice(1)||'').split('_').map(function(s){var m=s.split('.');return {p:by[m[0]],q:Math.max(1,parseInt(m[1]||'1',10)||1)};}).filter(function(i){return i.p;});
  var list=document.getElementById('list'),t=0,n=0;
  if(!items.length){list.innerHTML='<p class="empty">Este pedido está vacío.</p>';document.getElementById('total').hidden=true;}
  items.forEach(function(i,k){t+=i.p.precio*i.q;n+=i.q;
    list.insertAdjacentHTML('beforeend','<div class="item" style="animation-delay:'+k*90+'ms"><img src="'+i.p.fotos[0]+'" alt="'+i.p.nombre+'"><div><p class="name">'+i.p.nombre+'</p><p class="meta">'+pr(i.p.precio)+' × '+i.q+'</p></div><p class="sum">'+pr(i.p.precio*i.q)+'</p></div>');});
  document.getElementById('count').textContent=n?(n+(n===1?' pieza':' piezas')):'';
  document.querySelector('#total strong').textContent=pr(t);
  document.getElementById('wa').href=FEROLI_CONFIG.whatsappContacto||('https://wa.me/'+FEROLI_CONFIG.whatsapp);
})();
</script>
</body>
</html>
